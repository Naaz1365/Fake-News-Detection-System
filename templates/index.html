
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News Detection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f4f4f4;
        }

        .result-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .confidence {
            margin-bottom: 10px;
            font-size: 17px;
        }

        .explanation {
            color: #555;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Fake News Detection</h1>

    <p class="subtitle">
        AI-powered news authenticity analysis
    </p>

    <textarea
        id="newsText"
        placeholder="Enter news or statement here..."
    ></textarea>

    <button onclick="predictNews()">
        Predict
    </button>

    <div class="loading" id="loading">
        Analyzing...
    </div>

    <div id="result">

        <div class="result-title" id="prediction"></div>

        <div class="confidence" id="confidence"></div>

        <div class="explanation" id="explanation"></div>

    </div>

</div>


<script>

async function predictNews() {

    const text = document.getElementById("newsText").value.trim();

    if (!text) {
        alert("Please enter some news text.");
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("result").style.display = "none";

    try {

        const response = await fetch("/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: text
            })

        });

        const data = await response.json();

        document.getElementById("loading").style.display = "none";

        if (data.error) {
            alert(data.error);
            return;
        }

        document.getElementById("result").style.display = "block";

        document.getElementById("prediction").innerText =
            "Prediction: " + data.label;

        document.getElementById("confidence").innerText =
            "Confidence: " + data.confidence_like_score + "%";

        document.getElementById("explanation").innerText =
            data.score_note;

    } catch (error) {

        document.getElementById("loading").style.display = "none";

        alert("Unable to connect to Flask server.");

        console.error(error);
    }
}

</script>

</body>
</html>
